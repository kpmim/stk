<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sistem Tempahan Kenderaan — KPMIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1F3A;
  --navy2:#112847;
  --navy3:#163256;
  --gold:#C8973A;
  --gold2:#E2B55A;
  --gold-light:#FDF3E0;
  --gold-border:#E8C97A;
  --bg:#F2F4F8;
  --bg2:#FFFFFF;
  --bg3:#EDF0F5;
  --border:#DDE2EA;
  --border2:#C8CFDA;
  --text:#0D1B2E;
  --text2:#4A5568;
  --text3:#8896A8;
  --blue:#1A5FA8;
  --blue-bg:#E8F1FB;
  --blue-border:#A8C6EC;
  --green:#2D7A3A;
  --green-bg:#E6F4E8;
  --green-border:#8DC49A;
  --red:#B02828;
  --red-bg:#FCEAEA;
  --red-border:#E8A5A5;
  --amber:#A05A10;
  --amber-bg:#FDF3E0;
  --amber-border:#E8C97A;
  --purple:#4A3B9C;
  --purple-bg:#EEEAFA;
  --purple-border:#B0A5E0;
  --radius:8px;
  --radius-lg:14px;
  --radius-xl:20px;
  --shadow:0 1px 4px rgba(11,31,58,0.08),0 4px 16px rgba(11,31,58,0.04);
  --shadow-md:0 4px 20px rgba(11,31,58,0.12),0 1px 4px rgba(11,31,58,0.06);
}

body{
  background:var(--bg);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--text);
  min-height:100vh;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 60%,#1E4B7A 100%);
  padding:0 28px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(11,31,58,0.35);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 0;
  border-bottom:1px solid rgba(200,151,58,0.25);
  padding-bottom:14px;
  margin-bottom:0;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:44px;height:44px;
  background:linear-gradient(145deg,var(--gold),var(--gold2));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(200,151,58,0.4);
}
.brand-text h1{
  font-family:'Playfair Display',serif;
  font-size:16px;font-weight:600;
  color:#FFFFFF;letter-spacing:0.2px;line-height:1.2;
}
.brand-text .sub{
  font-size:10.5px;color:rgba(200,151,58,0.9);
  letter-spacing:0.8px;text-transform:uppercase;
  margin-top:2px;font-weight:500;
}
.header-right{display:flex;align-items:center;gap:12px}
.date-badge{
  font-size:11px;color:rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:4px 10px;border-radius:20px;
}

/* ── TAB BAR ── */
.tab-wrap{background:rgba(255,255,255,0.04);padding:0 28px}
.tab-bar{display:flex;gap:0;width:fit-content}
.tab{
  padding:10px 20px;
  font-size:12.5px;cursor:pointer;border:none;
  background:transparent;
  color:rgba(255,255,255,0.5);
  font-weight:500;
  font-family:'DM Sans',sans-serif;
  transition:all 0.2s;
  border-bottom:2.5px solid transparent;
  display:flex;align-items:center;gap:7px;
  position:relative;
}
.tab:hover{color:rgba(255,255,255,0.8)}
.tab.active{
  color:#FFFFFF;
  border-bottom-color:var(--gold);
}
.tab .tab-icon{opacity:0.7;transition:opacity 0.2s}
.tab.active .tab-icon{opacity:1}

/* ── CONTENT ── */
.content{padding:24px 28px;max-width:860px;margin:0 auto}

/* ── CARDS ── */
.card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.4rem;
  margin-bottom:1rem;
  box-shadow:var(--shadow);
  transition:box-shadow 0.2s;
}
.card:hover{box-shadow:var(--shadow-md)}
.card-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:1.1rem;
  padding-bottom:0.9rem;
  border-bottom:1px solid var(--border);
}
.card-icon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card-icon.navy{background:var(--navy);color:var(--gold)}
.card-icon.gold{background:var(--gold-light);color:var(--gold)}
.card-icon.blue{background:var(--blue-bg);color:var(--blue)}
.card-icon.green{background:var(--green-bg);color:var(--green)}
.card-icon.red{background:var(--red-bg);color:var(--red)}
.card-title{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-0.1px}
.card-title-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.1rem}
.stat-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px 14px;
  text-align:center;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
  transition:transform 0.15s,box-shadow 0.15s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
}
.stat-card.s-navy::before{background:linear-gradient(90deg,var(--navy),var(--navy3))}
.stat-card.s-gold::before{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stat-card.s-green::before{background:linear-gradient(90deg,var(--green),#4CAF60)}
.stat-card.s-red::before{background:linear-gradient(90deg,var(--red),#D44040)}
.stat-card.s-blue::before{background:linear-gradient(90deg,var(--blue),#3A7FC8)}
.stat-card.s-amber::before{background:linear-gradient(90deg,var(--amber),var(--gold))}
.stat-icon{margin:0 auto 8px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.stat-num{font-size:26px;font-weight:600;color:var(--text);letter-spacing:-0.5px;line-height:1}
.stat-lbl{font-size:10.5px;color:var(--text3);margin-top:5px;font-weight:500;text-transform:uppercase;letter-spacing:0.4px}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11.5px;color:var(--text2);font-weight:600;letter-spacing:0.1px}
input,select,textarea{
  width:100%;padding:9px 11px;
  border:1px solid var(--border2);
  border-radius:var(--radius);
  font-size:13px;background:var(--bg2);
  color:var(--text);font-family:'DM Sans',sans-serif;
  transition:border-color 0.15s,box-shadow 0.15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--navy3);
  box-shadow:0 0 0 3px rgba(17,40,71,0.08);
}
textarea{resize:vertical;min-height:72px}
.section-label{
  font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:0.9px;
  margin-bottom:9px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── BUTTONS ── */
.btn{
  padding:8px 18px;border-radius:var(--radius);
  font-size:12.5px;cursor:pointer;
  border:1px solid var(--border2);
  background:var(--bg2);color:var(--text);
  font-weight:500;font-family:'DM Sans',sans-serif;
  transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--bg3);border-color:var(--border2)}
.btn:active{transform:scale(0.98)}
.btn-primary{
  background:linear-gradient(135deg,var(--navy),var(--navy3));
  border-color:var(--navy);color:#fff;
  box-shadow:0 2px 8px rgba(11,31,58,0.2);
}
.btn-primary:hover{background:linear-gradient(135deg,var(--navy2),var(--navy));border-color:var(--navy2)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-color:var(--gold);color:#fff;
  box-shadow:0 2px 8px rgba(200,151,58,0.25);
}
.btn-gold:hover{background:linear-gradient(135deg,#B5852E,var(--gold));border-color:#B5852E}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 6px rgba(176,40,40,0.2)}
.btn-danger:hover{background:#8E2020;border-color:#8E2020}
.btn-success{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 6px rgba(45,122,58,0.2)}
.btn-success:hover{background:#226030;border-color:#226030}
.btn-sm{padding:5px 12px;font-size:11.5px}
.btn-xs{padding:3px 10px;font-size:11px}

/* ── BADGES ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;
  font-size:10.5px;font-weight:600;white-space:nowrap;
  letter-spacing:0.1px;
}
.badge-pending{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-lulus{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-reject{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-assigned{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge-waiting{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.badge-van{background:#EEF5FF;color:#1A5FA8;border:1px solid #A8C6EC}
.badge-bas{background:#F0F4FF;color:#3A4FA8;border:1px solid #A8B6EC}

/* ── ALERTS ── */
.alert{
  padding:11px 15px;border-radius:var(--radius);
  font-size:12.5px;margin-bottom:1rem;
  border-left:3px solid;line-height:1.55;
  display:flex;align-items:flex-start;gap:10px;
}
.alert-icon{flex-shrink:0;margin-top:1px}
.alert-info{background:var(--blue-bg);color:var(--blue);border-color:var(--blue);border-left-width:3px;border-right:1px solid var(--blue-border);border-top:1px solid var(--blue-border);border-bottom:1px solid var(--blue-border)}
.alert-warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber);border-left-width:3px;border-right:1px solid var(--amber-border);border-top:1px solid var(--amber-border);border-bottom:1px solid var(--amber-border)}
.alert-err{background:var(--red-bg);color:var(--red);border-color:var(--red);border-left-width:3px;border-right:1px solid var(--red-border);border-top:1px solid var(--red-border);border-bottom:1px solid var(--red-border)}
.alert-ok{background:var(--green-bg);color:var(--green);border-color:var(--green);border-left-width:3px;border-right:1px solid var(--green-border);border-top:1px solid var(--green-border);border-bottom:1px solid var(--green-border)}

/* ── REQUEST ROW ── */
.request-row{padding:15px 0;border-bottom:1px solid var(--border)}
.request-row:last-child{border-bottom:none}
.rr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rr-info p{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.rr-info span{font-size:11.5px;color:var(--text2);line-height:1.6}
.rr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.status-block{margin-top:10px;padding:10px 13px;border-radius:var(--radius);font-size:12px;line-height:1.55;display:flex;align-items:flex-start;gap:8px}
.status-block.lulus{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.status-block.reject{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.status-block.assigned{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.status-block.waiting{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.clash-info{margin-top:8px;padding:10px 13px;border-radius:var(--radius);font-size:11.5px;background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);line-height:1.6}

/* ── FLOW BAR ── */
.flow-bar{
  display:flex;align-items:center;
  margin-bottom:12px;
  background:var(--bg3);
  border-radius:var(--radius);
  padding:10px 14px;
  border:1px solid var(--border);
}
.flow-step{font-size:10.5px;color:var(--text3);text-align:center;flex:1;font-weight:500}
.flow-step.active{color:var(--navy);font-weight:700}
.flow-step.done{color:var(--green)}
.flow-arrow{color:var(--border2);font-size:12px;margin:0 3px}

/* ── TRIP ROW ── */
.trip-row{display:flex;gap:14px;align-items:flex-start}
.trip-col{flex:1}
.trip-sep{color:var(--gold);font-size:20px;margin-top:24px;flex-shrink:0;font-weight:300}
.trip-box{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px;
}
.trip-box .trip-label{
  font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.9px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.trip-label.pergi{color:var(--navy)}
.trip-label.balik{color:var(--green)}

/* ── BOOKING TABLE ── */
.booking-table{width:100%;font-size:11.5px;border-collapse:collapse;margin-top:8px}
.booking-table th{
  text-align:left;padding:7px 10px;
  background:var(--navy);color:rgba(255,255,255,0.7);
  font-weight:500;border-bottom:none;font-size:10.5px;letter-spacing:0.3px;
}
.booking-table th:first-child{border-radius:6px 0 0 0}
.booking-table th:last-child{border-radius:0 6px 0 0}
.booking-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.booking-table tr:last-child td{border-bottom:none}
.booking-table tr:hover td{background:var(--bg3)}

/* ── REC TABLE ── */
.rec-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:12px;border-radius:var(--radius);overflow:hidden}
.rec-table th{text-align:left;padding:8px 12px;background:var(--navy);color:rgba(255,255,255,0.8);font-weight:500;font-size:11px}
.rec-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.rec-table tr:last-child td{border-bottom:none}
.rec-table tr:nth-child(even) td{background:var(--bg3)}

/* ── SCHEDULE ITEM ── */
.schedule-item{
  background:var(--bg3);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:8px;
  border:1px solid var(--border);
  border-left:3px solid var(--navy);
  transition:border-left-color 0.2s;
}
.schedule-item:hover{border-left-color:var(--gold)}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(11,31,58,0.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  z-index:200;padding-top:60px;
}
.modal{
  background:var(--bg2);border-radius:var(--radius-xl);
  padding:1.6rem;width:90%;max-width:490px;
  border:1px solid var(--border);
  max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(11,31,58,0.25);
}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--text);font-family:'Playfair Display',serif}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:1.25rem}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-btn{
  padding:5px 14px;border-radius:20px;font-size:11.5px;
  cursor:pointer;border:1px solid var(--border2);
  background:var(--bg2);color:var(--text2);
  transition:all 0.15s;font-family:'DM Sans',sans-serif;font-weight:500;
}
.filter-btn:hover{border-color:var(--navy3);color:var(--navy)}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── MISC ── */
.divider{height:1px;background:var(--border);margin:1rem 0}
.edit-actions{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.loading-spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle}
.loading-spinner.dark{border-color:var(--border2);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.cap-info-box .alert{margin-bottom:0}

/* ── WELCOME BANNER ── */
.welcome-banner{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);
  border-radius:var(--radius-xl);
  padding:20px 22px;
  margin-bottom:1rem;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  box-shadow:var(--shadow-md);
  position:relative;overflow:hidden;
}
.welcome-banner::after{
  content:'';position:absolute;
  right:-30px;top:-30px;
  width:160px;height:160px;
  border-radius:50%;
  background:rgba(200,151,58,0.07);
  pointer-events:none;
}
.welcome-text .name{font-size:17px;font-weight:600;color:#fff;font-family:'Playfair Display',serif}
.welcome-text .role{font-size:11.5px;color:rgba(200,151,58,0.85);margin-top:3px;font-weight:500;letter-spacing:0.3px}
.welcome-text .desc{font-size:12px;color:rgba(255,255,255,0.55);margin-top:6px;line-height:1.5;max-width:340px}
.welcome-icon{
  width:52px;height:52px;flex-shrink:0;
  background:rgba(200,151,58,0.12);
  border:1px solid rgba(200,151,58,0.25);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
}

/* ── PEMANDU SAME CHECKBOX ── */
.checkbox-row{
  display:inline-flex;align-items:center;gap:8px;
  cursor:pointer;padding:8px 12px;
  background:var(--navy);
  border:1px solid rgba(200,151,58,0.3);
  border-radius:var(--radius);
  margin-bottom:12px;
  transition:background 0.15s;
  user-select:none;
}
.checkbox-row:hover{background:var(--navy2)}
.checkbox-row input[type=checkbox]{
  width:15px;height:15px;
  accent-color:var(--gold);
  cursor:pointer;flex-shrink:0;
}
.checkbox-row span{font-size:12.5px;color:rgba(255,255,255,0.85);font-weight:500}

/* ── PAGE FADE IN ── */
.content > *{animation:fadeUp 0.3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── KPMIM CREST placeholder SVG in header ── */

/* ── CALENDAR ── */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-head{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.5px;color:var(--text3);
  text-align:center;padding:6px 0;
}
.cal-cell{
  aspect-ratio:1;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;cursor:default;
  transition:transform 0.1s;
  min-height:38px;
}
.cal-cell:not(.cal-empty):hover{transform:scale(1.08);}
.cal-num{font-size:12px;font-weight:500;line-height:1}
.cal-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--red);margin-top:3px;
}
.cal-free{background:var(--green-bg);border:1px solid var(--green-border)}
.cal-free .cal-num{color:var(--green)}
.cal-booked{background:var(--red-bg);border:1px solid var(--red-border)}
.cal-booked .cal-num{color:var(--red);font-weight:700}
.cal-weekend{background:var(--bg3);border:1px solid var(--border)}
.cal-weekend .cal-num{color:var(--text3)}
.cal-today{box-shadow:0 0 0 2px var(--gold);}
.cal-empty{background:transparent;border:none}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ══ HEADER ══ -->
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">

function parseTarikh(str){
  if(!str) return null;
  const s = String(str).trim();
  // Format "DD/MM/YYYY ..." — ambil DD/MM/YYYY sahaja (ignore Apps Script garbage selepasnya)
  const matchDMY = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(matchDMY){
    return new Date(`${matchDMY[3]}-${matchDMY[2].padStart(2,'0')}-${matchDMY[1].padStart(2,'0')}`);
  }
  // Format "YYYY-MM-DD"
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    return new Date(s.slice(0,10));
  }
  // Lain-lain — cuba parse terus
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

// ── Format tarikh & masa dari pelbagai input Google Sheets ───────

// atau "02/06/2026", atau "2026-06-02", atau Date object
// ── Helper: tukar jam integer ke format 12jam Melayu ─────────────
function _to12jam(hRaw, mRaw){
  let h = parseInt(hRaw)||0, m = parseInt(mRaw)||0;
  const ampm = h >= 12 ? 'PTG' : 'PGI';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

// Format masa dari pelbagai format → "3:30 PTG"
function fmtMasaSahaja(str){
  if(!str) return '';
  const masaRaw = String(str).trim();
  // Full Date string (dari Google Sheets) — cth "Sat Dec 30 1899 15:30:00 GMT+0800"
  const d = new Date(masaRaw);
  if(!isNaN(d.getTime()) && masaRaw.length > 8){
    return _to12jam(d.getHours(), d.getMinutes());
  }
  // Format "HH:MM" atau "H:MM"
  if(/^\d{1,2}:\d{2}/.test(masaRaw)){
    const [hStr, mStr] = masaRaw.split(':');
    return _to12jam(hStr, mStr);
  }
  return masaRaw;
}

// Format tarikh sahaja → "02/06/2026"
function fmtTarikhSahaja(str){
  if(!str) return '-';
  const tRaw = String(str).trim();
  // Dah format DD/MM/YYYY — guna terus
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(tRaw)) return tRaw;
  const d = new Date(tRaw);
  if(!isNaN(d.getTime()) && d.getFullYear() > 1900){
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  return tRaw;
}

}

// Tukar pelbagai format tarikh → objek Date (atau null)
function parseAnyDate(val){
  if(!val) return null;
  // Dah jadi Date object
  if(val instanceof Date) return isNaN(val)?null:val;
  const s = String(val).trim();
  // Format DD/MM/YYYY
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m1) return new Date(+m1[3], +m1[2]-1, +m1[1]);
  // Format YYYY-MM-DD
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return new Date(+m2[1], +m2[2]-1, +m2[3]);
  // Cuba new Date() — tangani string pelik dari Sheets
  const d = new Date(s);
  if(!isNaN(d)) return d;
  return null;
}

// Tukar pelbagai format masa → { h, m } atau null
function parseAnyTime(val){
  if(!val) return null;
  const s = String(val).trim();
  // HH:MM atau H:MM
  const m1 = s.match(/^(\d{1,2}):(\d{2})/);
  if(m1) return {h:+m1[1], m:+m1[2]};
  // Dari Date object string — ambil jam:minit
  const d = new Date(s);
  if(!isNaN(d)) return {h:d.getHours(), m:d.getMinutes()};
  return null;
}

// Format tarikh → "Isnin, 2 Jun 2026"
function fmtTarikhPanjang(val){
  const d = parseAnyDate(val);
  if(!d) return val||'-';
  return `${HARI_MS[d.getDay()]}, ${d.getDate()} ${BULAN_MS[d.getMonth()]} ${d.getFullYear()}`;
}

// Format tarikh pendek → "2 Jun 2026"
function fmtTarikhPendek(val){
  const d = parseAnyDate(val);
  if(!d) return val||'-';
  return `${d.getDate()} ${BULAN_MS[d.getMonth()]} ${d.getFullYear()}`;
}

// Format masa → "3:30 PTG" (12 jam)
function fmtMasa12(val){
  const t = parseAnyTime(val);
  if(!t) return val||'-';
  const {h,m} = t;
  const label = h < 12 ? 'PG' : h < 18 ? 'PTG' : 'MLM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')} ${label}`;
}

async function semakStatusPermohonan(){
  const el = document.getElementById('s-gaji');
  const noGaji = (el?.value||'').trim();
  if(!noGaji){el.style.borderColor='var(--red)';setTimeout(()=>el.style.borderColor='',2000);return;}
  statusNoGaji = noGaji;

  // Kalau Apps Script belum dikonfig, guna mock data
  if(APPS_SCRIPT_URL==='LETAK_URL_APPS_SCRIPT_WEB_APP_DI_SINI'){
    const found = requests.filter(r=>String(r.noGaji).trim()===noGaji);
    statusResult = found.length ? found : 'notfound';
    const area = document.getElementById('status-result-area');
    if(area) area.innerHTML = renderStatusResult();
    return;
  }

  // Call Apps Script guna JSONP
  statusResult = 'loading';
  const area = document.getElementById('status-result-area');
  if(area) area.innerHTML = renderStatusResult();

  try {
    const json = await callAppsScript({ action: 'semakStatus', noGaji });
    if(json.found){
      statusResult = json.permohonan;
    } else {
      statusResult = 'notfound';
    }
  } catch(e) {
    statusResult = 'notfound';
  }
  if(area) area.innerHTML = renderStatusResult();
}

// ─── CALENDAR HELPERS ────────────────────────────────
function parseTarikh(str){
  if(!str)return null;
  const p=str.split('/');
  if(p.length===3){const d=new Date(+p[2],+p[1]-1,+p[0]);d.setHours(0,0,0,0);return d;}
  const d=new Date(str);return isNaN(d)?null:(d.setHours(0,0,0,0),d);
}
function fmtTarikhCal(d){
  if(!d)return'—';
  const bulan=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogs','Sep','Okt','Nov','Dis'];
  return d.getDate()+' '+bulan[d.getMonth()]+' '+d.getFullYear();
}

// FUNGSI KALENDAR DIPERBAIKI (TANPA MENGUBAH STRUKTUR)
// ══════════════════════════════════════════════════════
function buildCalData(){
  // Guna lulusData dari Apps Script kalau ada, fallback ke requests (mock)
  const sumber = (lulusData && lulusData.length > 0) ? lulusData : requests;
  
  // Tapis data: hanya kenderaan yang dipilih & bukan status 'rejected'
  const bookedRanges = sumber
    .filter(r => r.kenderaan === calKenderaan && r.status !== 'rejected')
    .map(r => ({
      start: parseTarikh(r.tarikhPergi), 
      end: parseTarikh(r.tarikhBalik), 
      id: r.id || r.nama, 
      pemohon: r.pemohon || r.nama
    }))
    .filter(b => b.start && b.end); // Pastikan tarikh sah

  const firstDay = new Date(calTahun, calBulan, 1);
  const lastDay  = new Date(calTahun, calBulan+1, 0);
  const startDow = firstDay.getDay();
  
  function isBooked(d){
    return bookedRanges.some(b => d >= b.start && d <= b.end);
  }
  function getInfos(d){
    return bookedRanges.filter(b => d >= b.start && d <= b.end);
  }
  
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-cell cal-empty"></div>';
  for(let d=1;d<=lastDay.getDate();d++){
    const dt=new Date(calTahun,calBulan,d);
    const booked=isBooked(dt);
    const infos=getInfos(dt);
    const isToday=dt.toDateString()===new Date().toDateString();
    const isMggu=dt.getDay()===0||dt.getDay()===6;
    const tooltip=infos.length?infos.map(b=>b.id+': '+b.pemohon).join('; '):'';
    cells+=`<div class="cal-cell ${booked?'cal-booked':isMggu?'cal-weekend':'cal-free'} ${isToday?'cal-today':''}" title="${tooltip}">
      <span class="cal-num">${d}</span>
      ${booked&&infos.length?'<span class="cal-dot"></span>':''}
    </div>`;
  }
  return {cells, bookedRanges};
}

  const {cells, bookedRanges} = buildCalData();

  // Update grid inside cal-card
  const card = document.getElementById('cal-card');
  if(!card) { render(); return; }

  // Update Van/Bas button styles
  card.querySelectorAll('button').forEach(btn=>{
    if(btn.textContent.trim()==='Van') btn.className='btn btn-sm '+(calKenderaan==='Van'?'btn-primary':'');
    if(btn.textContent.trim()==='Bas') btn.className='btn btn-sm '+(calKenderaan==='Bas'?'btn-primary':'');
  });

  // Update month label
  const spans = card.querySelectorAll('span');
  spans.forEach(s=>{ if(s.style.minWidth==='130px') s.textContent=bulanNama[calBulan]+' '+calTahun; });

  // Update calendar grid
  const grid = card.querySelector('.cal-grid');
  if(grid) grid.innerHTML = hari.map(h=>`<div class="cal-head">${h}</div>`).join('') + cells;

  // Update bookings list
  const bkDiv = document.getElementById('cal-bookings');
  if(bkDiv){
    if(bookedRanges.length){
      bkDiv.className='card';
      bkDiv.style.cssText='padding:1rem 1.4rem';

async function cariStaff(){
  const el = document.getElementById('f-gaji');
  const noGaji = (el?.value||'').trim();
  if(!noGaji){
    if(el){ el.style.borderColor='var(--red)'; setTimeout(()=>el.style.borderColor='',2000); }

  }
  const statusEl = document.getElementById('staff-status');

  // Tunjuk loading
  if(statusEl) statusEl.innerHTML=`<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)"><span class="loading-spinner dark"></span> Mencari maklumat staf...</div>`;

  // Kalau Apps Script belum dikonfig — fallback ke hardcode
  if(APPS_SCRIPT_URL==='LETAK_URL_APPS_SCRIPT_WEB_APP_DI_SINI'){

}

// ── JSONP helper — bypass CORS untuk Apps Script ─────────────
function callAppsScript(params) {
  return new Promise(function(resolve, reject) {
    const cbName = '_gs_cb_' + Date.now();
    const timeout = setTimeout(function() {
      delete window[cbName];
      reject(new Error('Timeout — Apps Script lambat respons'));
    }, 15000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      const script = document.getElementById(cbName);
      if(script) script.remove();
      resolve(data);
    };

    const qs = Object.keys(params).map(k =>
      encodeURIComponent(k) + '=' + encodeURIComponent(params[k])
    ).join('&');

    const script = document.createElement('script');
    script.id = cbName;
    script.src = APPS_SCRIPT_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      reject(new Error('Gagal muatkan script dari Apps Script'));
    };
    document.head.appendChild(script);
  });
}

    const j=document.getElementById('f-jawatan');  if(j) j.value=json.jawatan||'';
    const k=document.getElementById('f-kategori'); if(k) k.value=json.kategori||json.gred||'';
    const t=document.getElementById('f-tel');      if(t) t.value=json.noTel||'';

function sahkanLulus(rowIndex,sheet){if(confirm('Sahkan permohonan ini sebagai LULUS?'))updateStatus(rowIndex,sheet,'LULUS','');}
function bukaModalTolak(rowIndex,sheet,nama,destinasi,tarikhPergi,tarikhBalik,clashInfo){
  tutupModal();
  const ov=document.createElement('div');ov.className='modal-overlay';ov.id='modal-ov';
  ov.innerHTML=`<div class="modal">
    <p class="modal-title">Tolak Permohonan</p>
    <p class="modal-sub">${nama} &nbsp;·&nbsp; ${destinasi} &nbsp;·&nbsp; ${tarikhPergi} → ${tarikhBalik}</p>
    ${clashInfo?`<div class="clash-info" style="margin-bottom:1rem"><strong>Maklumat clash:</strong> ${clashInfo}</div>`:''}
    <div class="form-group" style="margin-bottom:1rem">
      <label>Sebab penolakan (dimaklumkan kepada pemohon)</label>
      <textarea id="reject-reason" rows="4" placeholder="Nyatakan sebab penolakan...">${clashInfo||''}</textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="tutupModal()">Batal</button>
      <button class="btn btn-danger" onclick="sahkanTolak(${rowIndex},'${sheet}')">Sahkan Penolakan</button>
    </div>
  </div>`;
  document.getElementById('app').appendChild(ov);
}
function sahkanTolak(rowIndex,sheet){const sebab=document.getElementById('reject-reason').value.trim();if(!sebab){alert('Sila nyatakan sebab penolakan.');return;}tutupModal();updateStatus(rowIndex,sheet,'REJECT',sebab);}
function tutupModal(){const m=document.getElementById('modal-ov');if(m)m.remove();}

function toggleSamaPemandu(id){
  const sama=document.getElementById('sama-'+id).checked;
  document.getElementById('mode-sama-'+id).style.display=sama?'':'none';
  document.getElementById('mode-beza-'+id).style.display=sama?'none':'';
}

function assignPemandu(id){
  const r=requests.find(x=>x.id===id);
  const sama=document.getElementById('sama-'+id).checked;
  let ppNoGaji,pbNoGaji;
  if(sama){
    ppNoGaji=document.getElementById('pp-'+id).value;
    pbNoGaji=ppNoGaji;
  } else {
    ppNoGaji=document.getElementById('pp2-'+id).value;
    pbNoGaji=document.getElementById('pb-'+id).value;
  }
  const ppObj=senaraipemandu.find(p=>p.noGaji===ppNoGaji)||{nama:ppNoGaji};
  const pbObj=senaraipemandu.find(p=>p.noGaji===pbNoGaji)||{nama:pbNoGaji};
  r.pemandupergi=ppObj.nama;
  r.pemandubalik=pbObj.nama;
  r.status='assigned';render();
}

  const r=requests.find(x=>x.id===sel);
  const op=parseFloat(document.getElementById('odo-pergi').value)||0;
  const ob=parseFloat(document.getElementById('odo-balik').value)||0;
  const tol=parseFloat(document.getElementById('toll').value)||0;
  const jarak=Math.max(0,ob-op);
  document.getElementById('rekod-output').innerHTML=`
  <div class="divider"></div>
  <div style="margin-top:1rem;margin-bottom:8px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.9px;font-weight:700">Rekod Perjalanan — ${r.id}</div>
  <table class="rec-table">
    <tr><th>Butiran</th><th>Maklumat</th></tr>
    <tr><td>Pemohon</td><td>${r.pemohon} (${r.jawatan})</td></tr>
    <tr><td>Destinasi</td><td>${r.destinasi}</td></tr>
    <tr><td>Tujuan</td><td>${r.tujuan}</td></tr>
    <tr><td>Tarikh pergi</td><td>${r.hariPergi}, ${r.tarikhPergi} jam ${r.waktuPergi}</td></tr>
    <tr><td>Tarikh balik</td><td>${r.hariBalik}, ${r.tarikhBalik} jam ${r.waktuBalik}</td></tr>
    <tr><td>Kenderaan</td><td>${r.kenderaan}</td></tr>
    <tr><td>Bilangan penumpang</td><td>${r.bilangan} orang</td></tr>
    <tr><td>Odometer pergi</td><td>${op.toLocaleString()} km</td></tr>
    <tr><td>Odometer balik</td><td>${ob.toLocaleString()} km</td></tr>
    <tr><td>Jumlah jarak</td><td><strong>${jarak.toLocaleString()} km</strong></td></tr>
    <tr><td>Toll &amp; lain-lain</td><td>RM ${tol.toFixed(2)}</td></tr>
  </table>
  <div style="margin-top:14px;display:flex;gap:8px">
    <button class="btn btn-primary" onclick="alert('Rekod disimpan.')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
      Simpan Rekod
    </button>
    <button class="btn btn-gold" onclick="alert('Rekod dieksport sebagai PDF.')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Eksport PDF
    </button>
  </div>`;
}

function render(){
  const c=document.getElementById('main-content');
  if(role==='pemohon')       c.innerHTML=renderPemohon();
  else if(role==='pentadbir')c.innerHTML=renderPentadbir();
  else if(role==='ketua')    c.innerHTML=renderKetua();
  else                       c.innerHTML=renderPemandu();
}

render();
</script>
</body>
</html>
